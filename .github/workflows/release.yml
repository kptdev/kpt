name: kpt multimodule release
on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        description: 'The new version/tag to be released'
        type: string
      branch: # TODO: make this ref-compatible so you can give branches AND commits
        required: false
        default: 'main'
        description: 'Branch to create the release on'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    name: kpt-multimodule-release
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check for replace directives in go.mod
        uses: ./.github/actions/check-go-mod-replace
      - name: Create commits and tags
        env:
          BRANCH: ${{ inputs.branch }}
          VERSION: ${{ inputs.version }}
        run: ./scripts/multimodule-release.sh "$VERSION"
      - name: Run GoReleaser
        id: run-goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --skip=validate --verbose -f release/tag/goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
