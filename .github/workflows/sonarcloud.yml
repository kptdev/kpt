name: SonarCloud analysis

on:
  workflow_run:
    workflows: [Go]
    types: [completed]

jobs:
  check-artifacts:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      actions: read
    outputs:
      has-artifacts: ${{ steps.check.outputs.has-artifacts }}
    steps:
      - name: Check for coverage artifact
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: ${{ github.event.workflow_run.id }}
            });
            const hasCoverage = artifacts.data.artifacts.some(a => a.name.startsWith('coverage-report-'));
            core.setOutput('has-artifacts', hasCoverage);

  sonarqube:
    needs: check-artifacts
    if: needs.check-artifacts.outputs.has-artifacts == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Download PR number artifact
        if: github.event.workflow_run.event == 'pull_request'
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151 # v21
        with:
          workflow: Go
          run_id: ${{ github.event.workflow_run.id }}
          name: PR_NUMBER
        continue-on-error: true

      - name: Read PR_NUMBER.txt
        if: github.event.workflow_run.event == 'pull_request' && hashFiles('PR_NUMBER.txt') != ''
        id: pr_number
        uses: juliangruber/read-file-action@271ff311a4947af354c6abcd696a306553b9ec18 # v1.1.8
        with:
          path: ./PR_NUMBER.txt

      - name: Request GitHub API for PR data
        if: github.event.workflow_run.event == 'pull_request' && hashFiles('PR_NUMBER.txt') != ''
        uses: octokit/request-action@b91aabaa861c777dcdb14e2387e30eddf04619ae # v3.0.0
        id: get_pr_data
        with:
          route: GET /repos/{full_name}/pulls/{number}
          number: ${{ steps.pr_number.outputs.content }}
          full_name: ${{ github.event.repository.full_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract PR metadata
        if: github.event.workflow_run.event == 'pull_request' && hashFiles('PR_NUMBER.txt') != ''
        id: pr_meta
        env:
          PR_DATA: ${{ steps.get_pr_data.outputs.data }}
        run: |
          echo "number=$(echo "$PR_DATA" | jq -r '.number')" >> "$GITHUB_OUTPUT"
          echo "head_ref=$(echo "$PR_DATA" | jq -r '.head.ref')" >> "$GITHUB_OUTPUT"
          echo "base_ref=$(echo "$PR_DATA" | jq -r '.base.ref')" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Checkout base branch
        if: github.event.workflow_run.event == 'pull_request'
        env:
          BASE_REF: ${{ steps.pr_meta.outputs.base_ref }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CLONE_URL: ${{ github.event.repository.clone_url }}
        run: |
          git remote add upstream "$CLONE_URL"
          git fetch upstream
          git checkout -B "$BASE_REF" "upstream/$BASE_REF"
          git checkout "$HEAD_SHA"
          git clean -ffdx && git reset --hard HEAD

      - name: Download coverage artifact (docker)
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151 # v21
        with:
          workflow: Go
          run_id: ${{ github.event.workflow_run.id }}
          name: coverage-report-docker
          use_unzip: true
        continue-on-error: true

      - name: Download coverage artifact (podman)
        if: hashFiles('coverage.out') == ''
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151 # v21
        with:
          workflow: Go
          run_id: ${{ github.event.workflow_run.id }}
          name: coverage-report-podman
          use_unzip: true
        continue-on-error: true

      - name: Fix Go module paths in coverage
        run: |
          sed -i 's|github.com/kptdev/kpt|.|g' coverage.out

      - name: Debug - Check condition variables before SonarQube scan
        run: |
          echo "=== DEBUG: Before SonarQube Scan Step ==="
          echo "Event type: ${{ github.event.workflow_run.event }}"
          echo "PR_NUMBER.txt exists: $(test -f PR_NUMBER.txt && echo 'YES' || echo 'NO')"
          echo "PR_NUMBER.txt contents:"
          cat PR_NUMBER.txt 2>/dev/null || echo "FILE NOT FOUND"
          echo "hashFiles result: $(ls -la PR_NUMBER.txt 2>&1 || echo 'ls failed')"
          echo "Current directory: $(pwd)"
          echo "Files in workspace:"
          ls -la ./ | grep -E "coverage|PR_NUMBER|sonar" || echo "No matching files"
          echo "=== END DEBUG ==="

      # Scan PR source, but never use PR-controlled scanner configuration. Fetch
      # settings from the same trusted revision as this workflow, after all
      # checkouts and artifact downloads, and keep them outside the worktree.
      - name: Load trusted SonarCloud settings
        id: sonar_settings
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const ref = process.env.TRUSTED_WORKFLOW_SHA;
            if (!/^[0-9a-f]{40}$/i.test(ref || '')) {
              throw new Error('A trusted workflow commit is required for SonarCloud settings');
            }
            const { data } = await github.rest.repos.getContent({
              ...context.repo,
              path: 'sonar.properties',
              ref,
            });
            if (data.type !== 'file' || data.encoding !== 'base64' || typeof data.content !== 'string') {
              throw new Error('Trusted SonarCloud settings must be a file with inline content');
            }
            const settings = Buffer.from(data.content, 'base64');
            if (settings.length === 0 || settings.length !== data.size) {
              throw new Error('Trusted SonarCloud settings are empty or incomplete');
            }
            const directory = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'sonar-settings-'));
            const settingsPath = path.join(directory, 'sonar.properties');
            fs.writeFileSync(settingsPath, settings, { mode: 0o600, flag: 'wx' });
            core.setOutput('path', settingsPath);

      - name: SonarQube Scan on PR
        if: github.event.workflow_run.event == 'pull_request' && steps.sonar_settings.outputs.path != ''
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # Keep PR metadata as JSON data, never as additional scanner arguments.
          SONAR_SCANNER_JSON_PARAMS: >-
            {
              "sonar.pullrequest.key": ${{ toJSON(steps.pr_meta.outputs.number) }},
              "sonar.pullrequest.branch": ${{ toJSON(steps.pr_meta.outputs.head_ref) }},
              "sonar.pullrequest.base": ${{ toJSON(steps.pr_meta.outputs.base_ref) }}
            }
        with:
          args:
            -Dsonar.projectKey=kptdev_kpt
            -Dsonar.organization=kptdev
            -Dsonar.host.url=https://sonarcloud.io
            "-Dproject.settings=${{ steps.sonar_settings.outputs.path }}"

      - name: SonarCloud Scan on push
        if: >-
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.event.repository.full_name &&
          steps.sonar_settings.outputs.path != ''
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args:
            -Dsonar.projectKey=kptdev_kpt
            -Dsonar.organization=kptdev
            -Dsonar.host.url=https://sonarcloud.io
            "-Dproject.settings=${{ steps.sonar_settings.outputs.path }}"

