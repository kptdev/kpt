# Generates SLSA provenance for the assets of the release created by release.yml.
# The recorded revision is the commit of the cli/vX.Y.Z tag. Release events are
# only delivered for releases created with an App or PAT token, which release.yml uses.

name: kpt release provenance
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  hash:
    # Only the CLI releases have assets.
    if: startsWith(github.event.release.tag_name, 'cli/v')
    runs-on: ubuntu-latest
    name: hash-release-assets
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check that the release tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --dir release-assets
          # Provenance from an earlier run is not an asset to attest.
          rm -f release-assets/*.intoto.jsonl
      - name: Generate SLSA subjects for provenance
        id: hash
        run: |
          set -euo pipefail

          hashes=$(cd release-assets && sha256sum -- * | base64 -w0)
          echo "hashes=${hashes}" >> "$GITHUB_OUTPUT"

  provenance:
    needs: [hash]
    permissions:
      actions: read # To read the workflow path.
      id-token: write # To sign the provenance.
      contents: write # To add assets to a release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.hash.outputs.hashes }}"
      upload-assets: true # upload to the release that triggered this run
