name: "Setup Go and kpt"
description: "Sets up Go from go.mod and installs kpt version matching go.mod"

inputs:
  install-kpt:
    description: "Whether to install kpt"
    required: false
    default: "true"
  go-version:
    description: "Exact version for Go version setup, go-version-file is ignored if set"
    required: false
  go-version-file:
    description: "Path to go.mod file for Go version setup"
    required: false
    default: "go.mod"
  kpt-version-file:
    description: "Path to the go.mod file used to resolve the kpt version. Defaults to go-version-file."
    required: false
    default: ""
  go-cache:
    description: "Enable Go module caching"
    required: false
    default: "true"
  cache-dependency-path:
    description: "Relative path to go.sum file for Go module caching"
    required: false
    default: "go.sum"

outputs:
  kpt-version:
    description: "The kpt version installed"
    value: ${{ steps.kpt-version.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ inputs.go-version }}
        go-version-file: ${{ inputs.go-version-file }}
        cache: ${{ inputs.go-cache == 'true' }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Get kpt version from go.mod
      if: inputs.install-kpt == 'true'
      id: kpt-version
      shell: bash
      env:
        GO_VERSION_FILE: ${{ inputs.go-version-file }}
        KPT_VERSION_FILE: ${{ inputs.kpt-version-file }}
      run: |
        set -euo pipefail
        VERSION_FILE="${KPT_VERSION_FILE:-$GO_VERSION_FILE}"
        if [ ! -f "$VERSION_FILE" ]; then
          echo "::error::kpt version file '${VERSION_FILE}' not found."
          exit 1
        fi
        GO_MOD_DIR=$(dirname -- "$VERSION_FILE")
        KPT_VERSION=$(cd "$GO_MOD_DIR" && go mod edit -json \
          | jq -r '(.Require[]? | select(.Path=="github.com/kptdev/kpt") | .Version) // ""')
        if [ -z "$KPT_VERSION" ]; then
          echo "::error::Could not resolve github.com/kptdev/kpt from ${VERSION_FILE}."
          exit 1
        fi
        echo "Using kpt version: ${KPT_VERSION}"
        echo "version=${KPT_VERSION}" >> "$GITHUB_OUTPUT"

    - name: Install kpt
      if: inputs.install-kpt == 'true'
      uses: jaxxstorm/action-install-gh-release@v2.1.0
      with:
        repo: kptdev/kpt
        # The kpt CLI binaries are published on the cli/ module's release tag
        # (e.g. cli/v1.0.2-pre.4); the root module tag carries no assets.
        tag: cli/${{ steps.kpt-version.outputs.version }}
        chmod: 0755
