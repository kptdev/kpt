baseURL = "https://kpt.dev/"
title = "kpt documentaion"

# Language settings
contentDir = "content"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
# Useful when translating.
enableMissingTranslationPlaceholders = true

enableRobotsTXT = true

theme = ["github.com/google/docsy"]

# Will give values to .Lastmod etc.
enableGitInfo = true

# Comment out to enable taxonomies in Docsy
disableKinds = ["taxonomy"]


# Highlighting config
pygmentsFences = true
pygmentsUseClasses = false

# Use the new Chroma Go highlighter in Hugo.
pygmentsUseClassic = false
#pygmentsOptions = "linenos=table"
# See https://help.farbox.com/pygments.html
pygmentsStyle = "tango"

#[module]
#  [[module.imports]]
#    path = "github.com/google/docsy"
#  [[module.imports]]
#    path = "github.com/FortAwesome/Font-Awesome"
#  [[module.imports]]
#    path = "github.com/twbs/bootstrap"

# Configure how URLs look like per section.
[permalinks]
blog = "/:section/:slug/"

# Image processing configuration.
[imaging]
resampleFilter = "CatmullRom"
quality = 75
anchor = "smart"

[services]
[services.googleAnalytics]
# Comment out the next line to disable GA tracking. Also disables the feature described in [params.ui.feedback].
# id = "UA-00000000-0"

# Language configuration

[languages]
[languages.en]
title = "kpt documentation"
label = "English"
# Weight used for sorting.
weight = 1
contentDir = "content/en"

[languages.en.params]
description = "kpt documentation"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        title = true
    [markup.goldmark.renderer.headingAnchor]
      enable = true
      prefix = ""
      suffix = ""
      plainID = true

  [markup.highlight]
    # See a complete list of available styles at https://xyproto.github.io/splash/docs/all.html
    style = "tango"
    # Uncomment if you want your chosen highlight style used for code blocks without a specified language
    # guessSyntax = "true"

# Everything below this are Site Params

[params]

kpt_version = "v1.0.0-beta.62.1"

code_of_conduct = "https://github.com/cncf/foundation/blob/main/code-of-conduct.md"

customCSS = ["https://fonts.googleapis.com/icon?family=Material+Icons+Outlined"]

time_format_blog = "January 2, 2006"
time_format_default = "January 2, 2006"
copyright = "kpt contributors "
#privacy_policy = "https://policies.google.com/privacy"

# First one is picked as the Twitter card image if not set on page.
#image = "https://tag-env-sustainability.cncf.io/images/cncf-sustainability-share.webp"

# Title of the navbar/sidebar versions selector, used to switch between the
# "latest" docs and archived release snapshots. The selector appears when at
# least one [[params.versions]] entry exists. The authoritative entries are
# generated from documentation/versions.json by scripts/build-versioned-docs.sh
# and override the static fallback at the end of this file (see there).
version_menu = "Releases"

# Flag used in the "version-banner" partial to decide whether to display a
# banner on every page indicating that this is an archived version of the docs.
# The working-tree ("latest") build is not archived; the build script overrides
# this to true for each tagged snapshot.
archived_version = false

# The version label for this doc set. The working-tree build is "latest"; the
# build script overrides this with the release label (e.g. "v1.0") per snapshot.
version = "latest"

# A link to the latest version of the docs. Used in the "version-banner" partial
# to point readers of an archived snapshot back to the current site.
url_latest_version = "/"

# Google Custom Search Engine ID. Remove or comment out to disable search.
# gcs_engine_id = "06963a606b9934e7b"

# Enable Algolia DocSearch

params.search.algolia = false

#Enable offline search with Lunr.js

offlineSearch = true
offlineSearchSummaryLength = 70
offlineSearchMaxResults = 10

# Enable syntax highlighting and copy buttons on code blocks with Prism
prism_syntax_highlighting = false

# Repository configuration (URLs for in-page links to opening issues and suggesting changes)
[params.github]
  repo = "https://github.com/kptdev/kpt"
  branch = "main"
  subdir = "documentation"

# Configure mermaid (charting) integration
[params.mermaid]
enable = true

# User interface configuration
[params.ui]
#  Set to true to disable breadcrumb navigation.
breadcrumb_disable = false
# Set to true to disable the About link in the site footer
footer_about_disable = true
# Set to false if you don't want to display a logo (/assets/icons/logo.svg) in the top navbar
navbar_logo = true
# Set to true if you don't want the top navbar to be translucent when over a `block/cover`, like on the homepage.
navbar_translucent_over_cover_disable = false
# Enable to show the side bar menu in its compact state.
sidebar_menu_compact = true
# Set to true to hide the sidebar search box (the top nav search box will still be displayed if search is enabled)
sidebar_search_disable = true

# Adds a H2 section titled "Feedback" to the bottom of each doc. The responses are sent to Google Analytics as events.
# This feature depends on [services.googleAnalytics] and will be disabled if "services.googleAnalytics.id" is not set.
# If you want this feature, but occasionally need to remove the "Feedback" section from a single page,
# add "hide_feedback: true" to the page's front matter.
[params.ui.feedback]
enable = false
# The responses that the user sees after clicking "yes" (the page was helpful) or "no" (the page was not helpful).
yes = 'Glad to hear it! Please <a href="https://github.com/cncf/tag-env-sustainability/issues/new">tell us how we can improve</a>.'
no = 'Sorry to hear that. Please <a href="https://github.com/cncf/tag-env-sustainability/issues/new">tell us how we can improve</a>.'

# Adds a reading time to the top of each doc.
# If you want this feature, but occasionally need to remove the Reading time from a single page, 
# add "hide_readingtime: true" to the page's front matter
[params.ui.readingtime]
enable = false

[[menu.main]]
name = "Functions Catalog"
url = "https://catalog.kpt.dev/"
weight = 40
target = "_self"

[[menu.main]]
name = "Porch"
url = "https://porch.kpt.dev/docs/"
weight = 50
target = "_self"

# Static fallback for the version selector so it renders during a plain
# `hugo serve` / working-tree build. scripts/build-versioned-docs.sh generates
# the authoritative list from documentation/versions.json and passes it as a
# config overlay, which replaces this array for the real multi-version build.
# Keep this in sync with documentation/versions.json.
[[params.versions]]
  version = "latest"
  url = "/"
[[params.versions]]
  version = "v1.0"
  url = "/v1.0/"
