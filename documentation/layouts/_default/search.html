{{ define "main" }}
<div>
	<h1 class="thin">{{ .Title }}</h1>

	<link href='{{ "/pagefind/pagefind-ui.css" }}' rel="stylesheet">

	<style>
		:root {
			--pagefind-ui-scale: 1;
			--pagefind-ui-primary: #000;
			--pagefind-ui-text: #000;
			--pagefind-ui-background: #ffffff;
			--pagefind-ui-border: #eeeeee;
			--pagefind-ui-tag: #eeeeee;
			--pagefind-ui-border-width: 2px;
			--pagefind-ui-border-radius: 8px;
			--pagefind-ui-image-border-radius: 8px;
			--pagefind-ui-image-box-ratio: 3 / 2;
			--pagefind-ui-font: 'Clarity City', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif, Roboto,
	Ubuntu, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol';
		}
	</style>
	<script src='{{ "/pagefind/pagefind-ui.js" }}' defer></script>

	<div id="search"></div>
	<script>
	window.addEventListener("DOMContentLoaded", (event) => {
		const pagefind = new PagefindUI({ element: "#search", showSubResults: true, showImages: false, resetStyles: false });

		const urlParams = new URLSearchParams(window.location.search);
		const q = urlParams.get('q');
		if (q) {
			const trigger = function() {
				if (pagefind && typeof pagefind.triggerSearch === 'function') {
					pagefind.triggerSearch(q);
				}
			};
			trigger();
			setTimeout(trigger, 250);
		}

		$(document).on("input", "#search input", function() {
			var inputValue = $(this).val();
			updateQueryString("q", inputValue);
		});
	});

	function updateQueryString(key, value) {
		var baseUrl = window.location.href.split("?")[0];
		var queryString = window.location.search.slice(1);
		var urlParams = new URLSearchParams(queryString);

		if (value) {
			urlParams.set(key, value);
		} else {
			urlParams.delete(key);
		}

		var newUrl = urlParams.toString() ? baseUrl + "?" + urlParams.toString() : baseUrl;
		window.history.replaceState({}, null, newUrl);
	}
	</script>
	
</div>
{{ end }}
