# This defines the build for goreleaser (https://goreleaser.com/). It is
# executed by the multimodule release workflow (.github/workflows/release.yml),
# which publishes the GitHub release itself, so GoReleaser is run with
# --skip=publish and only builds and packages the artifacts.
# As kpt needs to be compiled with CGO, we cannot simply just provide a simple
# matrix of GOOS and GOARCH combinations, but instead, we'd need to define separate
# steps for each targetted OS and ARCH. This is because we need to specify the
# platform specific C std library (libc) and cross-compiler to be used.

# The CLI is released from tags like cli/v1.2.3. GoReleaser's monorepo.tag_prefix
# setting is not available in the open-source build, so the workflow sets
# GORELEASER_CURRENT_TAG=cli/v1.2.3 and the templates below strip the prefix
# with (base .Tag).
version: 2
env:
  - CGO_ENABLED=0
  - GO111MODULE=on
# All other tags besides cli/* must not be treated as the previous CLI release.
git:
  ignore_tags:
    - "v*"
    - "api/*"
    - "porch/*"
    - "package-examples/*"
builds:
  - id: darwin-amd64
    env:
      - CGO_ENABLED=0
      - GO111MODULE=on
    goos:
      - darwin
    goarch:
      - amd64
    ldflags: -s -w -X main.version={{ trimprefix (base .Tag) "v" }} -X main.gitCommit={{.FullCommit}}
    dir: cli

  - id: darwin-arm64
    env:
      - CGO_ENABLED=0
      - GO111MODULE=on
    goos:
      - darwin
    goarch:
      - arm64
    ldflags: -s -w -X main.version={{ trimprefix (base .Tag) "v" }} -X main.gitCommit={{.FullCommit}}
    dir: cli

  - id: linux-amd64
    env:
      - CGO_ENABLED=0
      - GO111MODULE=on
    goos:
      - linux
    goarch:
      - amd64
    ldflags: -s -w -X main.version={{ trimprefix (base .Tag) "v" }} -X main.gitCommit={{.FullCommit}} -extldflags "-z noexecstack"
    dir: cli

  - id: linux-arm64
    env:
      - CGO_ENABLED=0
      - GO111MODULE=on
    goos:
      - linux
    goarch:
      - arm64
    ldflags: -s -w -X main.version={{ trimprefix (base .Tag) "v" }} -X main.gitCommit={{.FullCommit}}  -extldflags "-z noexecstack"
    dir: cli

archives:
  - id: archived
    ids:
      - darwin-amd64
      - darwin-arm64
      - linux-amd64
      - linux-arm64
    files:
      - LICENSES*
      - lib.zip*
    name_template: '{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}-{{ trimprefix (base .Tag) "v" }}'
  - id: bin-only
    formats: binary
    ids:
      - darwin-amd64
      - darwin-arm64
      - linux-amd64
      - linux-arm64
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
nfpms:
  - id: linux-packages
    ids:
      - linux-amd64
      - linux-arm64
    formats:
      - deb
      - rpm
      - apk
    homepage: https://kpt.dev
    maintainer: The kpt Authors
    description: kpt - Automate Kubernetes Configuration Editing
    license: Apache-2.0
    section: utils
    dependencies:
      - git
    bindir: /usr/local/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/kpt/LICENSE
    file_name_template: '{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}-{{ trimprefix (base .Tag) "v" }}'
checksum:
  name_template: "checksums.txt"
# The release notes and the GitHub release are created by the release workflow
# (the open-source build cannot scope a changelog to a module).
changelog:
  disable: true
